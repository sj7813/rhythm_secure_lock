project:
  title:        "Rhythm Secure LED Locker"
  description:  "A security lock system that unlocks by recording and matching LED rhythm patterns."
  author:       "sjcho"
  discord:      "none"
  language:     "Verilog"
  top_module:   "tt_um_sjcho_LEDLocker"
  tiles:        "1x1"

  source_files:
    - tt_um_sjcho_LEDLocker.v
    - button_debouncer.v
    - LED_rhythm_generator.v
    - comparator.v
    - password_storage.v
  clock_hz: 50000000

# 설계 설명
documentation:
  how_it_works: |
    This project is a rhythm-based digital lock. 
    It records a specific timing pattern of button presses (rhythm) and stores it. 
    When the user enters a pattern again, it compares the input rhythm with the stored one. 
    If they match, the lock opens (unlocks).
  how_to_test: |
    1. Reset the system using the rst_n pin (active low).
    2. Press the record button (ui_in[0]) to start recording your rhythm.
    3. Input your rhythm using the key_in pins (ui_in[5:2]).
    4. Press the enter button (ui_in[1]) to verify the pattern.
    5. Check the flag_unlock (uo_out[7]) to see if it matches.

# 입출력 핀 설명 (비어있으면 에러가 날 수 있으니 모두 채워야 함)
  # inputs:
  ui[0]: "record_button"
  ui[1]: "enter_button"
  ui[2]: "key_in[0]"
  ui[3]: "key_in[1]"
  ui[4]: "key_in[2]"
  ui[5]: "key_in[3]"
  ui[6]: "none"
  ui[7]: "none"

  # Outputs
  uo[0]: "led_rhythm[0]"
  uo[1]: "led_rhythm[1]"
  uo[2]: "led_rhythm[2]"
  uo[3]: "led_rhythm[3]"
  uo[4]: "led_status[0]"
  uo[5]: "led_status[1]"
  uo[6]: "led_status[2]"
  uo[7]: "flag_unlock"

  # Bidirectional pins
  uio[0]: "unused"
  uio[1]: "unused"
  uio[2]: "unused"
  uio[3]: "unused"
  uio[4]: "unused"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "unused"

# Do not change!
yaml_version: 6
